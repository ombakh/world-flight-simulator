<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A TensorFlow-powered browser app that opens the computer camera and detects common objects in real time."
    />
    <title>TensorFlow Camera Object Detector</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="scan-search"></i></span>
          <div>
            <h1>TensorFlow Object Detector</h1>
            <p>Live camera recognition with COCO-SSD</p>
          </div>
        </div>
        <div class="status-pill" id="statusText" data-tone="idle">Preparing detector...</div>
      </header>

      <main class="workspace">
        <section class="camera-stage" aria-label="Live camera object detection">
          <div class="camera-frame">
            <video id="cameraFeed" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="camera-placeholder">
              <div>
                <i data-icon="camera"></i>
                <strong>Camera feed appears here</strong>
                <span>Allow browser camera access to begin scanning.</span>
              </div>
            </div>
          </div>

          <div class="metrics" aria-label="Detection metrics">
            <div class="metric">
              <span>Objects</span>
              <strong id="objectCount">0</strong>
            </div>
            <div class="metric">
              <span>FPS</span>
              <strong id="fps">0</strong>
            </div>
          </div>
        </section>

        <aside class="side-panel" aria-label="Detector controls">
          <section class="panel-section">
            <h2 class="section-heading"><i data-icon="settings-2"></i> Controls</h2>
            <div class="button-grid">
              <button class="command-button primary" id="startButton" type="button">
                <i data-icon="play"></i>
                Start
              </button>
              <button class="command-button" id="stopButton" type="button" disabled>
                <i data-icon="circle-stop"></i>
                Stop
              </button>
              <button class="icon-button" id="flipButton" type="button" disabled>
                <i data-icon="rotate-ccw"></i>
                Switch camera
              </button>
            </div>
          </section>

          <section class="panel-section">
            <h2 class="section-heading"><i data-icon="scan-search"></i> Sensitivity</h2>
            <div class="control-row">
              <label for="confidence">
                <span>Minimum confidence</span>
                <strong id="confidenceValue">55%</strong>
              </label>
              <input id="confidence" type="range" min="20" max="90" step="5" value="55" />
            </div>
          </section>

          <section class="panel-section">
            <h2 class="section-heading"><i data-icon="loader-circle"></i> System</h2>
            <div class="status-grid">
              <div class="status-card">
                <span>Model</span>
                <strong id="modelStatus">Pending</strong>
              </div>
              <div class="status-card">
                <span>Camera</span>
                <strong id="cameraStatus">Off</strong>
              </div>
            </div>
          </section>

          <section class="panel-section">
            <h2 class="section-heading"><i data-icon="scan-search"></i> Detections</h2>
            <p class="empty-state" id="emptyState">No objects detected yet.</p>
            <ul class="detection-list" id="detectionList" aria-live="polite"></ul>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
